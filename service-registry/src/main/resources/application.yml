spring:
  application:
    name: service-registry

  security:
    user:
      name: ${EUREKA_USERNAME:finpay}
      password: ${EUREKA_PASSWORD:finpay}

server:
  port: 8761
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
    # Prefer the address other containers can actually reach over the container's own hostname.
    prefer-ip-address: false

  client:
    # This is a single standalone registry, so it neither registers with nor fetches from a peer.
    # Running a peer-replicated pair is a deployment concern, handled in the Kubernetes manifests.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_USERNAME:finpay}:${EUREKA_PASSWORD:finpay}@${eureka.instance.hostname}:${server.port}/eureka/

  server:
    # Self-preservation stops Eureka evicting instances when it loses too many heartbeats at once,
    # which protects a real cluster from a network partition emptying the registry. With a handful
    # of local instances that same behaviour keeps dead services listed for a long time, so compose
    # turns it off. It stays on by default, which is the setting a real deployment wants.
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    eviction-interval-timer-in-ms: 15000
    response-cache-update-interval-ms: 5000

management:
  # Actuator listens on its own port, which docker-compose deliberately does not publish.
  # Metrics, health detail and route topology are operator surface, not public API; keeping
  # them off the port clients can reach is stronger than relying on a path rule or a
  # credential. Prometheus scrapes it from inside the network.
  server:
    port: ${MANAGEMENT_PORT:9090}

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # Safe because the port is unreachable from outside the network.
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  observations:
    key-values:
      application: ${spring.application.name}

  tracing:
    sampling:
      # Every request is sampled locally, where volume is low and a missing trace is the
      # thing that wastes an afternoon. A production deployment lowers this.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO

---
# Containers log structured JSON so a collector can index each field, including the request id
# that ties a call together. Running locally the default human-readable format is kept: JSON is
# for machines, and a developer reading a terminal is not one.
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
