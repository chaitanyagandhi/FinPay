# FinPay local development infrastructure.
#
# Backing services (PostgreSQL, Redis, Kafka, Kafka UI) plus the application services that
# have been implemented so far. The remaining application containers are added in the build
# steps that implement them, so that `docker compose up -d` always reaches a healthy state.
#
# Credentials below are local development defaults. They are deliberately committed so the
# stack starts with no additional setup; nothing here is used outside a developer machine.
# Override any of them with a local .env file, which is git-ignored.
#
#   docker compose config      validate and render the effective configuration
#   docker compose up -d       start the stack
#   docker compose ps          show container state and health
#   docker compose down        stop containers, keep data
#   docker compose down -v     stop containers and delete all data

name: finpay

networks:
  finpay:
    name: finpay
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:

services:
  postgres:
    image: postgres:17.10-alpine
    container_name: finpay-postgres
    restart: unless-stopped
    environment:
      # Bootstrap superuser. Individual services connect as their own per-database role,
      # created by infrastructure/docker/postgres/initdb/01-create-service-databases.sh.
      POSTGRES_USER: ${POSTGRES_USER:-finpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finpay}
      POSTGRES_DB: ${POSTGRES_DB:-finpay}
      FINPAY_SERVICE_DB_PASSWORD: ${FINPAY_SERVICE_DB_PASSWORD:-finpay}
      # Deterministic collation so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpay} -d ${POSTGRES_DB:-finpay}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - finpay
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  redis:
    image: redis:8.10.0-alpine
    container_name: finpay-redis
    restart: unless-stopped
    # Append-only persistence so idempotency and rate-limit state survives a restart.
    # Redis is a cache and fast-path store only; PostgreSQL remains the durable record.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-finpay}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-finpay} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - finpay
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384m

  kafka:
    image: apache/kafka:4.1.2
    container_name: finpay-kafka
    restart: unless-stopped
    # Single-node KRaft cluster: this broker is both controller and broker. No ZooKeeper.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-EtbvZy3HSVK1xcwCL1FydQ}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # INTERNAL is how containers reach the broker; EXTERNAL is how the host reaches it.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker, so every replication factor must be 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Three partitions per topic keeps ordering-by-key behaviour visible in local testing.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the services that own them.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - finpay
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: finpay-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: finpay-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_PORT: 8080
    # 8090 on the host: 8080 is reserved for the API gateway.
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - finpay
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  # --- Application services ---------------------------------------------------------------

  config-server:
    build:
      # Root context: the Maven reactor needs the parent POM and the sibling module POMs.
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        MODULE: config-server
        SERVICE_PORT: "8888"
    image: finpay/config-server:0.1.0-SNAPSHOT
    container_name: finpay-config-server
    restart: unless-stopped
    environment:
      # "docker" selects the in-network addresses the server hands to its clients.
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_USERNAME: ${CONFIG_SERVER_USERNAME:-finpay}
      CONFIG_SERVER_PASSWORD: ${CONFIG_SERVER_PASSWORD:-finpay}
      TZ: UTC
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      # Health is deliberately unauthenticated so this check needs no credentials.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8888/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - finpay
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  service-registry:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        MODULE: service-registry
        SERVICE_PORT: "8761"
    image: finpay/service-registry:0.1.0-SNAPSHOT
    container_name: finpay-service-registry
    restart: unless-stopped
    environment:
      # The registry advertises this hostname to clients, so it has to be the name other
      # containers resolve rather than the container's own id.
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOSTNAME: service-registry
      EUREKA_USERNAME: ${EUREKA_USERNAME:-finpay}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-finpay}
      # Off locally: with a handful of instances, self-preservation keeps services that are
      # genuinely gone listed as UP for a long time. Deployments leave it on.
      EUREKA_SELF_PRESERVATION: "false"
      TZ: UTC
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - finpay
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
      args:
        MODULE: api-gateway
        SERVICE_PORT: "8080"
    image: finpay/api-gateway:0.1.0-SNAPSHOT
    container_name: finpay-api-gateway
    restart: unless-stopped
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_HOST: service-registry
      EUREKA_PORT: "8761"
      EUREKA_USERNAME: ${EUREKA_USERNAME:-finpay}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-finpay}
      TZ: UTC
    # The only application port published to the host: everything else is reached through here.
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - finpay
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
