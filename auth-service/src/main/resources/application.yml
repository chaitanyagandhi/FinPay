spring:
  application:
    name: auth-service

  # Platform-wide defaults are served by the config server, not restated here. The served
  # property source is inserted above this file, so a key set in both places silently resolves
  # to the served value - which is why the shared defaults were deleted from here rather than
  # left as harmless duplicates. A key belongs in exactly one of the two places.
  # "optional:" refers to whether the location can be resolved at all, not to whether the
  # server has to answer. It is required so that a test setting spring.cloud.config.enabled=false
  # skips the import cleanly; without it the standard resolver tries to read "configserver:..."
  # as a filename and the context fails to start. Refusing to boot when the server is down is
  # fail-fast's job, below.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME:finpay}
      password: ${CONFIG_SERVER_PASSWORD:finpay}
      # Refuse to start rather than boot on local defaults alone. A service that silently
      # comes up without the platform's serialization and error rules is worse than one that
      # does not come up: it answers requests, incorrectly.
      fail-fast: true

  datasource:
    # Each service connects as its own role to its own database. Using the bootstrap
    # superuser here would silently defeat the database-per-service isolation that
    # infrastructure/docker/postgres/initdb enforces.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finpay_auth}
    username: ${DB_USERNAME:finpay_auth}
    password: ${DB_PASSWORD:finpay}
    hikari:
      pool-name: auth-service-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 3000
      # A leaked connection should surface as a log entry rather than as a pool that
      # slowly empties until the service stops answering.
      leak-detection-threshold: 30000

  jpa:
    # Flyway owns the schema. "validate" makes Hibernate refuse to start if the entities and the
    # migrated tables disagree, which turns a silent mismatch into a failed boot.
    hibernate:
      ddl-auto: validate
    # Off deliberately: with it on, a lazy association can be initialised while a response is
    # being rendered, which hides N+1 queries and holds a connection for the whole request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Surfaces accidental N+1s as a failure during development rather than as latency.
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The schema is created by migrations from empty, so there is no legacy state to
    # baseline over. Turning this on would let a mismatched database start up quietly.
    baseline-on-migrate: false
    # Refuse to start if an applied migration's checksum no longer matches the file: an
    # edited migration means the running schema is not the one in source control.
    validate-on-migrate: true
    # Migrations run as the service's own role, which owns its schema.
    clean-disabled: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:finpay}:${EUREKA_PASSWORD:finpay}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

finpay:
  openapi:
    title: FinPay Authentication API
    description: Registration, sign-in and token lifecycle for the FinPay platform.

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

server:
  # The port is this service's own; graceful shutdown and the error-rendering rules are
  # platform defaults and come from the config server.
  port: 8081
