spring:
  application:
    name: config-server

  profiles:
    # The native backend is only registered when the "native" profile is active. Including it
    # here rather than setting spring.profiles.active keeps it in effect when an environment
    # adds its own profile, for example SPRING_PROFILES_ACTIVE=docker.
    include: native

  cloud:
    config:
      server:
        native:
          # The served configuration ships inside the jar, so the platform starts without a
          # second repository being reachable. Production overrides this with a git backend.
          search-locations: classpath:/config

  security:
    user:
      name: ${CONFIG_SERVER_USERNAME:finpay}
      password: ${CONFIG_SERVER_PASSWORD:finpay}

server:
  port: 8888
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  # Actuator listens on its own port, which docker-compose deliberately does not publish.
  # Metrics, health detail and route topology are operator surface, not public API; keeping
  # them off the port clients can reach is stronger than relying on a path rule or a
  # credential. Prometheus scrapes it from inside the network.
  server:
    port: ${MANAGEMENT_PORT:9090}

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # Safe because the port is unreachable from outside the network.
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  observations:
    key-values:
      application: ${spring.application.name}

  tracing:
    sampling:
      # Every request is sampled locally, where volume is low and a missing trace is the
      # thing that wastes an afternoon. A production deployment lowers this.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO

---
# Containers log structured JSON so a collector can index each field, including the request id
# that ties a call together. Running locally the default human-readable format is kept: JSON is
# for machines, and a developer reading a terminal is not one.
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
