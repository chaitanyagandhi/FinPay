spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # Never publish routes automatically from the registry. Doing so would expose
              # every service the moment it registers, including its /internal endpoints, and
              # would make the public API surface a side effect of deployment rather than a
              # deliberate decision. Routes below are explicit.
              enabled: false

          default-filters:
            # Both the gateway and the downstream service stamp the response with the request
            # id, so without this the client receives the header twice. Same value both times,
            # but duplicate headers are ambiguous and some clients read only one of them.
            - DedupeResponseHeader=X-Request-Id, RETAIN_FIRST

          httpclient:
            # A downstream that never answers must not hold a gateway connection open
            # indefinitely. Resilience4j adds per-route circuit breaking and bulkheads later;
            # these are the transport-level floor.
            connect-timeout: 2000
            response-timeout: 10s

          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/beneficiaries/**

            - id: wallet-service
              uri: lb://wallet-service
              predicates:
                - Path=/api/v1/wallets/**

            - id: transaction-service
              uri: lb://transaction-service
              predicates:
                - Path=/api/v1/transactions/**,/api/v1/statements/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**,/api/v1/payment-requests/**

            - id: fraud-service
              uri: lb://fraud-service
              predicates:
                - Path=/api/v1/admin/fraud/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/notification-preferences/**

            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/api/v1/admin/audit-events/**

            # Each service's own OpenAPI document, proxied so the aggregated Swagger page
            # can load them all from one origin without a CORS exemption.
            - id: auth-service-docs
              uri: lb://auth-service
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service, /v3/api-docs

            - id: user-service-docs
              uri: lb://user-service
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service, /v3/api-docs

            - id: wallet-service-docs
              uri: lb://wallet-service
              predicates:
                - Path=/v3/api-docs/wallet-service
              filters:
                - RewritePath=/v3/api-docs/wallet-service, /v3/api-docs

            - id: transaction-service-docs
              uri: lb://transaction-service
              predicates:
                - Path=/v3/api-docs/transaction-service
              filters:
                - RewritePath=/v3/api-docs/transaction-service, /v3/api-docs

            - id: payment-service-docs
              uri: lb://payment-service
              predicates:
                - Path=/v3/api-docs/payment-service
              filters:
                - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

            - id: fraud-service-docs
              uri: lb://fraud-service
              predicates:
                - Path=/v3/api-docs/fraud-service
              filters:
                - RewritePath=/v3/api-docs/fraud-service, /v3/api-docs

            - id: notification-service-docs
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

            - id: audit-service-docs
              uri: lb://audit-service
              predicates:
                - Path=/v3/api-docs/audit-service
              filters:
                - RewritePath=/v3/api-docs/audit-service, /v3/api-docs

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USERNAME:finpay}:${EUREKA_PASSWORD:finpay}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    # Containers are addressed by IP inside the compose network; the container hostname is
    # not resolvable by other services.
    prefer-ip-address: true

springdoc:
  # api-docs stays enabled even though the gateway publishes no API of its own: the Swagger
  # page loads its list of services from /v3/api-docs/swagger-config, which this serves.
  # Disabling it removes that endpoint and the page comes up empty.
  swagger-ui:
    path: /swagger-ui.html
    # One page listing every service. Each entry loads through the gateway, so the reader
    # never needs a service's internal address.
    urls:
      - name: auth-service
        url: /v3/api-docs/auth-service
      - name: user-service
        url: /v3/api-docs/user-service
      - name: wallet-service
        url: /v3/api-docs/wallet-service
      - name: transaction-service
        url: /v3/api-docs/transaction-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: fraud-service
        url: /v3/api-docs/fraud-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: audit-service
        url: /v3/api-docs/audit-service
    urls-primary-name: auth-service

management:
  # Actuator listens on its own port, which docker-compose deliberately does not publish.
  # Metrics, health detail and route topology are operator surface, not public API; keeping
  # them off the port clients can reach is stronger than relying on a path rule or a
  # credential. Prometheus scrapes it from inside the network.
  server:
    port: ${MANAGEMENT_PORT:9090}

  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      # Safe because the port is unreachable from outside the network.
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  observations:
    key-values:
      application: ${spring.application.name}

  tracing:
    sampling:
      # Every request is sampled locally, where volume is low and a missing trace is the
      # thing that wastes an afternoon. A production deployment lowers this.
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO

---
# Containers log structured JSON so a collector can index each field, including the request id
# that ties a call together. Running locally the default human-readable format is kept: JSON is
# for machines, and a developer reading a terminal is not one.
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: ecs
